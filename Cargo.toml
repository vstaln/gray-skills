[package]
name = "gray-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "skill hub browser/installer — search npm/GitHub/skills-cli for agent skills and install them into ~/.gray/skills"

[[bin]]
name = "gray-skills"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
